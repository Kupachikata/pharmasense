name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PHARMASENSE_OWNER_PASSWORD: owner_ci
      PHARMASENSE_APP_PASSWORD: app_ci
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://pharmasense_app:app_ci@localhost:5432/pharmasense
      MIGRATION_DATABASE_URL: postgresql+psycopg://pharmasense_owner:owner_ci@localhost:5432/pharmasense
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Create database roles
        run: ../infra/postgres/bootstrap.sh
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  compose:
    # M0 acceptance: a fresh clone starts with docker compose and the health check passes.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Health through the web proxy
        run: |
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
